<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>TEXT by Petro</title>
  <style>html,body{margin:0;background:#061d16}body{display:none}</style>
</head>
<body>
<script>
(() => {
  'use strict';
  const source = new URL(location.href);
  const target = new URL('./client.html', location.href);

  source.searchParams.forEach((value, key) => target.searchParams.set(key, value));

  // Preserve Telegram Mini App launch data from the URL fragment.
  target.hash = source.hash || '';
  location.replace(target.href);
})();
</script>
<noscript><a href="client.html">Відкрити TEXT by Petro</a></noscript>
</body>
</html>
